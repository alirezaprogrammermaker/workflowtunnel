name: Cloudflare Tunnel Runner

on:
  workflow_dispatch:

jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        run: |
          # Download and install cloudflared
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared
          echo "cloudflared installed"

      - name: Start services
        run: |
          # Redirect all output to log file
          exec > >(tee /tmp/workflow.log) 2>&1

          # Start HTTP server in background
          python3 -m http.server 8000 --directory /tmp &
          SERVICE_PID=$!
          echo "HTTP_PID=$SERVICE_PID" >> $GITHUB_ENV
          echo "HTTP server started on port 8000 (PID: $SERVICE_PID)"

          sleep 3

          # Verify service is running
          echo "Testing HTTP server..."
          curl -s http://localhost:8000 | head -c 100 || echo "Server ready"

          echo ""
          echo "=============================================="
          echo "Starting Cloudflare Tunnel..."
          echo "(No account needed - using quick tunnel)"
          echo "=============================================="
          echo ""

          # Start cloudflared quick tunnel - NO TOKEN NEEDED!
          # This creates a temporary tunnel without Cloudflare account
          ./cloudflared tunnel --url http://localhost:8000 &
          TUNNEL_PID=$!
          echo "TUNNEL_PID=$TUNNEL_PID" >> $GITHUB_ENV

          sleep 10

          # Extract and display the tunnel URL
          echo ""
          echo "=============================================="
          echo "  CLOUDFLARE TUNNEL URL"
          echo "=============================================="
          TUNNEL_URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' /tmp/workflow.log | tail -1)
          echo "$TUNNEL_URL"
          echo "=============================================="
          echo ""
          echo "✅ Access your service at the URL above!"
          echo "⏱️  Service will run for ~60 minutes"
          echo "❌ Cancel workflow to stop"
          echo ""

          # Keep workflow alive
          sleep 3540

      - name: Cleanup
        if: always()
        run: |
          echo "Stopping services..."
          [ -n "$HTTP_PID" ] && kill $HTTP_PID 2>/dev/null || true
          [ -n "$TUNNEL_PID" ] && kill $TUNNEL_PID 2>/dev/null || true
          echo "Done"
