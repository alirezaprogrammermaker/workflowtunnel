name: Cloudflare Tunnel Runner

on:
  workflow_dispatch:

jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        run: |
          # Download and install cloudflared
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared
          echo "cloudflared installed successfully"

      - name: Start services
        run: |
          # Redirect all output to both console and log file
          exec > >(tee /tmp/workflow.log) 2>&1
          set -x

          # Start HTTP server in background
          python3 -m http.server 8000 --directory /tmp &
          SERVICE_PID=$!
          echo "HTTP_PID=$SERVICE_PID" >> $GITHUB_ENV
          echo "HTTP server started on port 8000 (PID: $SERVICE_PID)"

          sleep 3

          # Verify service is running
          curl -s -o /dev/null -w "%{http_code}" http://localhost:8000 || echo "Service check"

          echo ""
          echo "=============================================="
          echo "Starting Cloudflare Tunnel..."
          echo "=============================================="
          echo ""

          # Start cloudflared tunnel - this keeps running and creates the tunnel
          # The tunnel URL is printed to stdout
          ./cloudflared tunnel --no-autoupdate --token ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }} &
          TUNNEL_PID=$!
          echo "TUNNEL_PID=$TUNNEL_PID" >> $GITHUB_ENV
          echo "Cloudflared tunnel started (PID: $TUNNEL_PID)"

          sleep 10

          # Extract and display the tunnel URL prominently
          echo ""
          echo "=============================================="
          echo "  CLOUDFLARE TUNNEL URL"
          echo "=============================================="
          grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' /tmp/workflow.log | tail -1 || echo "Waiting for URL..."
          echo "=============================================="
          echo ""
          echo "You can now access your service at the URL above"
          echo "The service will run for the duration of this workflow"
          echo "Press Ctrl+C or cancel the workflow to stop"
          echo ""

          # Keep the workflow alive - will run until timeout or cancellation
          # This sleep allows the tunnel and service to keep running
          sleep 3570  # ~60 minutes minus setup time

      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up services..."
          if [ -n "${{ env.HTTP_PID }}" ]; then
            kill ${{ env.HTTP_PID }} 2>/dev/null || true
          fi
          if [ -n "${{ env.TUNNEL_PID }}" ]; then
            kill ${{ env.TUNNEL_PID }} 2>/dev/null || true
          fi
          echo "Cleanup complete"
